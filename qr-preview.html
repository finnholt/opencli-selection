<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>百应登录二维码预览</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 32px 16px;
      font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1c; color: #e8e8ea; }
      textarea { background: #2a2a2d; color: #e8e8ea; border-color: #444; }
      .card { background: #2a2a2d; }
      .hint { color: #999; }
    }
    h1 { font-size: 18px; margin: 0; font-weight: 600; }
    .hint { color: #6e6e73; font-size: 13px; text-align: center; max-width: 520px; }
    textarea {
      width: min(720px, 92vw);
      height: 120px;
      padding: 12px 14px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #0071e3; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    button {
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      background: #0071e3;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button.ghost { background: #e2e2e6; color: #1d1d1f; }
    button:active { transform: translateY(1px); }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 260px;
    }
    .card img { width: 240px; height: 240px; image-rendering: pixelated; border-radius: 8px; }
    .meta { font-size: 12px; color: #6e6e73; }
    .empty { width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; color: #aaa; border: 2px dashed #d2d2d7; border-radius: 8px; }
    .error { color: #e23; font-size: 13px; }
  </style>
</head>

  <div class="row">
    <button id="render">渲染二维码</button>
    <button class="ghost" id="clear">清空</button>
  </div>

  <div class="card">
    <div id="slot"><div class="empty">等待粘贴…</div></div>
    <div class="meta" id="meta"></div>
  </div>

  <script>
    const input = document.getElementById('input');
    const slot = document.getElementById('slot');
    const meta = document.getElementById('meta');

    // 接受三种输入:① 完整 data URI ② 裸 base64 ③ 整行 QR_READY {json}
    function extractDataUri(raw) {
      const s = raw.trim();
      if (!s) return null;

      // ③ QR_READY {json}:抽 .base64 字段
      if (s.startsWith('QR_READY')) {
        try {
          const json = JSON.parse(s.slice('QR_READY'.length).trim());
          if (json.base64) return json.base64;
        } catch { /* 落到下面按文本处理 */ }
      }
      // 也兼容直接粘了一段 JSON 对象
      if (s[0] === '{') {
        try {
          const json = JSON.parse(s);
          if (json.base64) return json.base64;
          if (json.qr_base64) return json.qr_base64;
        } catch { /* 忽略 */ }
      }

      // ① 已经是 data URI
      if (s.startsWith('data:image')) return s;

      // ② 裸 base64(去掉可能混入的空白/换行)
      const cleaned = s.replace(/\s+/g, '');
      if (/^[A-Za-z0-9+/=]+$/.test(cleaned) && cleaned.length > 50) {
        return 'data:image/png;base64,' + cleaned;
      }
      return null;
    }

    function render() {
      const uri = extractDataUri(input.value);
      if (!uri) {
        slot.innerHTML = '<div class="empty error">没识别出 base64<br>(检查是否粘全)</div>';
        meta.textContent = '';
        return;
      }
      const img = new Image();
      img.onload = () => {
        slot.innerHTML = '';
        slot.appendChild(img);
        const bytes = Math.round((uri.split(',')[1] || '').length * 3 / 4);
        meta.textContent = `${img.naturalWidth}×${img.naturalHeight}px · ~${(bytes / 1024).toFixed(1)} KB`;
      };
      img.onerror = () => {
        slot.innerHTML = '<div class="empty error">base64 解不出合法图片</div>';
        meta.textContent = '';
      };
      img.src = uri;
    }

    document.getElementById('render').onclick = render;
    document.getElementById('clear').onclick = () => {
      input.value = '';
      slot.innerHTML = '<div class="empty">等待粘贴…</div>';
      meta.textContent = '';
      input.focus();
    };
    // 粘贴即渲染,省一次点击
    input.addEventListener('paste', () => setTimeout(render, 0));
    input.addEventListener('input', render);
  </script>
